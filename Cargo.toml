[package]
name = "controller-companion"
version = "1.2.3"
edition = "2021"
description = "Native Rust reimplementation of Controller Companion core (XInput -> mouse+keyboard). Steam features removed."
license = "MIT"

[features]
default = ["gui", "voice"]
gui = ["eframe", "dep:winit", "dep:arabic_reshaper", "dep:unicode-bidi"]
voice = ["dep:cpal", "dep:whisper-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
eframe = { version = "0.27", optional = true, default-features = false, features = ["wgpu", "glow", "default_fonts"] }
winit = { version = "0.29", optional = true }
arabic_reshaper = { version = "0.4.2", optional = true }
unicode-bidi = { version = "0.3.18", optional = true }
cpal = { version = "0.18", optional = true }
whisper-rs = { version = "0.16", optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
